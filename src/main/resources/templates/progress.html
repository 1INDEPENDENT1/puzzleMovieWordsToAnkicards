<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::title}, ~{::section})">
<head>
    <title>Export Progress - PuzzleMovies Export</title>
</head>
<section class="card" th:with="jobId=${job.id}">
    <h1>Export progress</h1>
    <p class="muted">Track export status and progress.</p>

    <div class="progress-panel" data-job-id="" th:attr="data-job-id=${job.id},data-warning-presented=${warningPresented}">
        <div class="status-line">
            <span>Status:</span>
            <strong id="status-text" th:text="${completion.completeness != null and completion.completeness.name() == 'PARTIAL' ? 'COMPLETED (partial export)' : job.status}"></strong>
        </div>
        <div class="status-line">
            <span>Phase:</span>
            <strong id="phase-text" th:text="${job.phase}"></strong>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" th:style="|width: ${job.progressPercent}%|"></div>
        </div>
        <div class="progress-meta">
            <span id="progress-percent" th:text="${job.progressPercent}"></span>% complete
        </div>
        <div class="progress-meta">
            Rows: <span id="row-count" th:text="${job.rowCount != null ? job.rowCount : 0}"></span>
        </div>
        <div class="error" id="error-text" role="alert" th:text="${completion.errorMessage}"
             th:style="${completion.errorMessage != null} ? '' : 'display:none;'"></div>
        <div class="warning" id="warning-text" role="status" aria-live="polite"
             th:style="${completion.warningMessage != null} ? '' : 'display:none;'">
            <span id="warning-message" th:text="${completion.warningMessage}"></span>
            <span>Unparsed source records: <strong id="unparsed-count" th:text="${completion.unparsedRecordCount}"></strong>.</span>
        </div>
        <p id="review-unavailable" class="muted"
           th:style="${completion.completeness != null and !completion.reviewCreationAvailable} ? '' : 'display:none;'">Generated review records are no longer available; run a fresh export to create review cards.</p>
        <div class="download" id="download-link"
             th:style="${completion.downloadAvailable} ? '' : 'display:none;'">
            <a th:href="@{'/exports/' + ${job.id} + '/download'}">Download TSV</a>
        </div>
        <form class="review-create" id="review-create"
              method="post"
              action="/reviews/cards"
              th:style="${completion.reviewCreationAvailable} ? '' : 'display:none;'">
            <input type="hidden" name="sourceExportId" th:value="${job.id}">
            <button type="submit">Create review cards</button>
        </form>
    </div>

    <script th:src="@{/js/progress.js}"></script>
</section>
</html>
