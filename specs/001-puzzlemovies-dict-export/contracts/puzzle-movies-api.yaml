openapi: 3.0.3
info:
  title: Puzzle-Movies External API (Observed)
  version: 1.0.0
  description: External endpoints consumed by the CLI exporter.
servers:
  - url: https://puzzle-movies.com
paths:
  /:
    get:
      summary: Fetch guest cookies
      responses:
        "200":
          description: Guest session page with Set-Cookie headers
  /api2/user/signin:
    post:
      summary: Sign in and obtain authenticated cookies
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                cookie:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: Authenticated response with Set-Cookie headers
  /dictionary:
    get:
      summary: Fetch dictionary pages (words or phrases)
      parameters:
        - in: query
          name: item
          required: true
          schema:
            type: string
            enum: [word, phrase]
        - in: query
          name: noredirect
          required: true
          schema:
            type: string
            enum: [""]
        - in: query
          name: page
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: HTML page containing dictionary rows
        "302":
          description: Redirect when unauthorized or session expired
        "404":
          description: Page not found
