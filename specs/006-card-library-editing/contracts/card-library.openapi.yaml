openapi: 3.0.3
info:
  title: PuzzleMovies Card Library Contract
  version: 0.6.0
  description: Learner-owned vocabulary-card library and content editing endpoints.
paths:
  /cards:
    get:
      summary: Show the signed-in learner's paginated card library
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Server-rendered table of active cards and derived statistics.
        '400':
          description: Page is negative, malformed, or outside the integer range.
        '401':
          description: Learner is not signed in.
  /cards/{id}:
    patch:
      summary: Update learner-editable content for one card
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardContentUpdateRequest'
      responses:
        '200':
          description: Updated content for use by either edit entry point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardContentUpdateResponse'
        '400':
          description: Missing, malformed, too-long, or blank required original text.
        '401':
          description: Learner is not signed in.
        '404':
          description: Card does not exist for the signed-in learner.
        '409':
          description: Card changed after the client opened it; reload before retrying.
components:
  parameters:
    CardId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CardContentUpdateRequest:
      type: object
      required:
        - originalText
        - version
      properties:
        originalText:
          type: string
          description: Required nonblank study target; validated after trimming surrounding whitespace.
          minLength: 1
          maxLength: 1000
        instanceText:
          type: string
          nullable: true
          maxLength: 4000
        translationText:
          type: string
          nullable: true
          maxLength: 8000
        version:
          type: integer
          format: int64
          minimum: 0
    EditableCardView:
      type: object
      required:
        - id
        - originalText
        - version
      properties:
        id:
          type: string
          format: uuid
        originalText:
          type: string
        instanceText:
          type: string
          nullable: true
        translationText:
          type: string
          nullable: true
        sourceContext:
          type: string
          nullable: true
        state:
          type: string
        dueAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        lookupActions:
          type: array
          items:
            $ref: '#/components/schemas/LookupAction'
    LookupAction:
      type: object
      required:
        - type
        - label
        - url
      properties:
        type:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
    CardContentUpdateResponse:
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/EditableCardView'
